.brand-t { padding-left: 12px; border-left: 1px solid var(--line); }
h1 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 600; }
.org { font-size: 12.5px; color: var(--fg-2); }
label { font-size: 13px; font-weight: 600; }
.pw-wrap { position: relative; margin-top: 6px; }
#pw { display: block; width: 100%; padding: 9px 42px 9px 10px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
#pw:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; min-height: 0; padding: 0; display: grid; place-items: center; color: var(--fg-2); background: transparent; border: 0; border-radius: 5px; }
.eye:hover { color: var(--fg); background: var(--surface-2); }
.eye[aria-pressed="false"] .slash { display: none; }
#pw::-ms-reveal, #pw::-ms-clear { display: none; }   /* 엣지 자체 보기 버튼 (눈이 두 개 되지 않게) */
.keep { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: var(--fg-2); cursor: pointer; }
.keep input { width: 16px; height: 16px; margin: 0; accent-color: var(--arm); }
button { font: inherit; font-weight: 600; padding: 9px 14px; min-height: 40px; color: var(--bg); background: var(--fg); border: 1px solid var(--fg); border-radius: 6px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .6; cursor: progress; }
.msg { min-height: 1.5em; margin: 0; font-size: 13px; color: var(--fg-2); }
.msg.bad { color: var(--danger-fg); }
</style>

<script>
(function () {
  'use strict';
  var SALT = 'ZQXJxAdcHems6I67YHJlGg==', IV = 'eSFEVwRVwQ8hlKUe', ITER = 600000, KEY_NAME = 'sem-site-key:ZQXJxAdcHems';
  var form = document.getElementById('gate'), pw = document.getElementById('pw'), keep = document.getElementById('keep'), eye = document.getElementById('eye');
  // 눈 버튼: 비밀번호 보기 · 숨기기 (보는 중이면 눈에 빗금)
  eye.addEventListener('click', function () { var on = pw.type === 'password'; pw.type = on ? 'text' : 'password'; var t = on ? '비밀번호 숨기기' : '비밀번호 보기'; eye.setAttribute('aria-pressed', on ? 'true' : 'false'); eye.setAttribute('aria-label', t); eye.title = t; pw.focus(); });
  var go = document.getElementById('go'), msg = document.getElementById('msg');
  var bytes = function (b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
  var toB64 = function (buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  var say = function (text, bad) { msg.textContent = text; msg.className = bad ? 'msg bad' : 'msg'; };
  var store = function (k) { try { return k === 'local' ? localStorage : sessionStorage; } catch (e) { return null; } };

  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) {
    form.hidden = false; go.disabled = true;
    say('이 브라우저에서는 열 수 없습니다. 최신 Chrome, Edge, Safari, Firefox 에서 여세요.', true);
    return;
  }

  function unlock(key) {
    var data = bytes(document.getElementById('payload').textContent.trim());
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, data).then(function (packed) {
      var stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    });
  }
  function show(html) { document.open(); document.write(html); document.close(); }

  function fromPassword(text) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(text.normalize('NFC')), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }

  function remembered() {
    var raw = null, s;
    for (var k of ['session', 'local']) { s = store(k); if (s && (raw = s.getItem(KEY_NAME))) break; }
    if (!raw) return Promise.reject();
    return crypto.subtle.importKey('raw', bytes(raw), 'AES-GCM', true, ['decrypt']);
  }
  function forget() { ['session', 'local'].forEach(function (k) { var s = store(k); if (s) s.removeItem(KEY_NAME); }); }

  // 브라우저가 주소창 입력 중 미리 연 (prerender) · 뒤에서 연 탭이면 실제로 보일 때까지 기다렸다가 앱을 씀:
  //   보이지 않는 상태에서 문서를 바꿔 쓰면 그 제한 (화면 갱신 · 타이머 늦춤) 이 새 문서에 남아 새로고침 전까지 끌기가 버벅일 수 있음
  function whenShown(fn) {
    var done = false, go2 = function () { if (done || document.prerendering || document.visibilityState !== 'visible') return; done = true; document.removeEventListener('prerenderingchange', go2); document.removeEventListener('visibilitychange', go2); fn(); };
    document.addEventListener('prerenderingchange', go2); document.addEventListener('visibilitychange', go2); go2();
  }
  // 탭에서 처음 열 때는 앱을 만들기 전에 한 번 새로 엶 (손으로 새로고침하면 끌기가 부드러워지는 것과 같게). 같은 탭에서는 한 번만
  var RF = KEY_NAME + '-r';
  function reloadOnce() { var ss = store('session'); try { if (ss && !ss.getItem(RF)) { ss.setItem(RF, '1'); location.reload(); return true; } } catch (e) { /* 저장 막힘: 그냥 열기 */ } return false; }
  function hasKey() { for (var k of ['session', 'local']) { var s = store(k); try { if (s && s.getItem(KEY_NAME)) return true; } catch (e) { /* 막힘 */ } } return false; }
  whenShown(function () {
    if (hasKey() && reloadOnce()) return;
    remembered().then(function (key) { return unlock(key); }).then(show, function () {
      forget();
      form.hidden = false; pw.focus();
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) return;
    if (pw.type !== 'password') eye.click();
    go.disabled = true; say('여는 중…');
    var key;
    fromPassword(pw.value).then(function (k) { key = k; return unlock(k); }).then(function (html) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        forget();
        var s = store(keep.checked ? 'local' : 'session'), saved = false;
        try { if (s) { s.setItem(KEY_NAME, toB64(raw)); saved = true; } } catch (err) { /* 저장 공간이 막힌 브라우저: 이번만 열림 */ }
        // 비밀번호를 넣은 이 문서를 그대로 앱으로 바꾸면 브라우저의 비밀번호 · 자동 채우기 감시가 남아 그림을 다시 그릴 때마다 일해 끌기가 버벅임
        //   → 키를 저장했으면 새로 열어 (저장된 키로 바로 열림) 깨끗한 문서로. 저장 못 했으면 이번만 그 자리에서
        if (saved) { try { var ss = store('session'); if (ss) ss.setItem(RF, '1'); } catch (err) { /* 막힘 */ } location.reload(); } else show(html);
      });
    }).catch(function () {
      go.disabled = false; pw.select();
      say('비밀번호가 맞지 않습니다.', true);
    });
  });
})();
